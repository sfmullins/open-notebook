name: Apply source command ID regression fix

on:
  push:
    branches:
      - fix/postgres-source-command-id

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/postgres-source-command-id
          fetch-depth: 0

      - name: Apply domain fix and regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          domain = Path("open_notebook/domain/notebook.py")
          text = domain.read_text()
          old = (
              '    @field_validator("command", mode="before")\n'
              '    @classmethod\n'
              '    def parse_command(cls, value):\n'
              '        """Parse command field to ensure RecordID format"""\n'
              '        if isinstance(value, str) and value:\n'
              '            return ensure_record_id(value)\n'
              '        return value\n'
          )
          new = (
              '    @field_validator("command", mode="before")\n'
              '    @classmethod\n'
              '    def parse_command(cls, value):\n'
              '        """Normalize command IDs from strings or serialized RecordID mappings."""\n'
              '        if isinstance(value, str) and value:\n'
              '            return ensure_record_id(value)\n'
              '        if isinstance(value, dict):\n'
              '            return RecordID.parse(value)\n'
              '        return value\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected one command validator block, found {text.count(old)}")
          domain.write_text(text.replace(old, new, 1))

          test = Path("tests/test_source_command_record_id.py")
          test.write_text(
              '"""Regression tests for PostgreSQL source command references."""\n\n'
              'from open_notebook.database.record_id import RecordID\n'
              'from open_notebook.domain.notebook import Source\n\n\n'
              'def test_source_command_survives_strict_model_dump_round_trip():\n'
              '    """ObjectModel.save() strictly revalidates model_dump(); RecordID must rehydrate."""\n'
              '    source = Source(id="source:123", title="Test", command="command:456")\n\n'
              '    dumped = source.model_dump()\n'
              '    assert dumped["command"] == {"table": "command", "id": "456"}\n\n'
              '    validated = Source.model_validate(dumped, strict=True)\n'
              '    assert isinstance(validated.command, RecordID)\n'
              '    assert str(validated.command) == "command:456"\n\n\n'
              'def test_source_prepare_save_data_preserves_command_reference():\n'
              '    """The PostgreSQL save payload keeps the command reference as one RecordID."""\n'
              '    source = Source(id="source:123", title="Test", command="command:456")\n\n'
              '    data = source._prepare_save_data()\n\n'
              '    assert isinstance(data["command"], RecordID)\n'
              '    assert str(data["command"]) == "command:456"\n'
          )

          Path(".github/workflows/apply-source-command-id-fix.yml").unlink()
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add open_notebook/domain/notebook.py tests/test_source_command_record_id.py .github/workflows/apply-source-command-id-fix.yml
          git commit -m "fix(postgres): preserve source command IDs across validation"
          git push origin HEAD:fix/postgres-source-command-id
