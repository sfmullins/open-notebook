name: PR2 mypy remediation

on:
  push:
    branches:
      - fix/valt-runtime-hardening

permissions:
  contents: write

concurrency:
  group: pr2-mypy-remediation
  cancel-in-progress: true

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://open_notebook:open_notebook@127.0.0.1:5432/open_notebook
      POSTGRES_URL: postgresql://open_notebook:open_notebook@127.0.0.1:5432/open_notebook
      OPEN_NOTEBOOK_ENCRYPTION_KEY: ci-test-key
      UV_PYTHON: "3.11"
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: open_notebook
          POSTGRES_PASSWORD: open_notebook
          POSTGRES_DB: open_notebook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U open_notebook -d open_notebook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/valt-runtime-hardening
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Apply type narrowing fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("open_notebook/domain/provider_config.py")
          text = path.read_text(encoding="utf-8")
          old = '''            for provider, provider_creds in creds_data.items():
                if not isinstance(provider_creds, list):
                    continue
                credentials[provider] = []
                for raw in provider_creds:
                    try:
                        cred_data = dict(raw)
'''
          new = '''            for provider, provider_creds in creds_data.items():
                if not isinstance(provider_creds, list):
                    continue
                provider_name = str(provider)
                credentials[provider_name] = []
                for raw in provider_creds:
                    try:
                        cred_data = dict(raw)
'''
          if old not in text:
              raise SystemExit("provider credential loop pattern not found")
          text = text.replace(old, new, 1)
          old = '''                        credentials[provider].append(
                            ProviderCredential(
                                id=cred_data.get("id", ""),
                                name=cred_data.get("name", "Default"),
                                provider=cred_data.get("provider", provider),
'''
          new = '''                        provider_value = cred_data.get("provider")
                        if not isinstance(provider_value, str) or not provider_value:
                            provider_value = provider_name
                        credentials[provider_name].append(
                            ProviderCredential(
                                id=cred_data.get("id", ""),
                                name=cred_data.get("name", "Default"),
                                provider=provider_value,
'''
          if old not in text:
              raise SystemExit("provider credential append pattern not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("open_notebook/ai/model_discovery.py")
          text = path.read_text(encoding="utf-8")
          old = '''    result = []
    grouped: Dict[str, int] = {}
    for row in rows:
        model_type = row.get("type")
        if model_type:
            grouped[model_type] = grouped.get(model_type, 0) + 1
    result = [{"type": key, "count": value} for key, value in grouped.items()]

    counts = {
        "language": 0,
        "embedding": 0,
        "speech_to_text": 0,
        "text_to_speech": 0,
    }

    for row in result:
        model_type = row.get("type")
        count = row.get("count", 0)
        if model_type in counts:
            counts[model_type] = count

    return counts
'''
          new = '''    grouped: Dict[str, int] = {}
    for row in rows:
        model_type = row.get("type")
        if isinstance(model_type, str) and model_type:
            grouped[model_type] = grouped.get(model_type, 0) + 1

    counts = {
        "language": 0,
        "embedding": 0,
        "speech_to_text": 0,
        "text_to_speech": 0,
    }

    for model_type, count in grouped.items():
        if model_type in counts:
            counts[model_type] = count

    return counts
'''
          if old not in text:
              raise SystemExit("model count pattern not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Verify backend before commit
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uv sync --frozen --group dev
          uv run ruff format open_notebook/domain/provider_config.py open_notebook/ai/model_discovery.py
          uv run ruff check .
          uv run python -m mypy .
          uv run pytest tests/ -q --tb=short
      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add open_notebook/domain/provider_config.py open_notebook/ai/model_discovery.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(types): narrow migrated provider and model values"
          git push origin HEAD:fix/valt-runtime-hardening
