name: PR2 quality remediation

on:
  push:
    branches:
      - fix/valt-runtime-hardening

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/valt-runtime-hardening
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Repair backend lint introduced by repository migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          notebooks = Path("api/routers/notebooks.py")
          text = notebooks.read_text(encoding="utf-8")
          replacements = {
              "        if notebook_update.name is not None: notebook.name = notebook_update.name\n":
                  "        if notebook_update.name is not None:\n            notebook.name = notebook_update.name\n",
              "        if notebook_update.description is not None: notebook.description = notebook_update.description\n":
                  "        if notebook_update.description is not None:\n            notebook.description = notebook_update.description\n",
              "        if notebook_update.archived is not None: notebook.archived = notebook_update.archived\n":
                  "        if notebook_update.archived is not None:\n            notebook.archived = notebook_update.archived\n",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected notebook lint pattern not found: {old!r}")
              text = text.replace(old, new, 1)
          notebooks.write_text(text, encoding="utf-8")

          boundary = Path("scripts/check_no_surreal_runtime.py")
          boundary.write_text('''#!/usr/bin/env python3
          """Enforce PostgreSQL-only shipped runtime; SurrealDB is migration-source only."""

          from __future__ import annotations

          import re
          import sys
          import tomllib
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          RUNTIME_DIRS = tuple(
              ROOT / path
              for path in (
                  "api",
                  "commands",
                  "open_notebook",
                  "command_queue",
                  "deploy",
                  "examples",
                  "scripts",
              )
          )
          ROOT_FILES = tuple(
              ROOT / path
              for path in (
                  "Dockerfile",
                  "docker-compose.yml",
                  "docker-compose.dev.yml",
                  "docker-compose.override.yml.example",
                  "Makefile",
                  "dev-init.sh",
                  "start.sh",
                  "supervisord.conf",
              )
          )
          ALLOWED = {
              ROOT / "scripts" / "migrate_surreal_to_postgres.py",
              ROOT / "scripts" / "check_no_surreal_runtime.py",
          }
          SUFFIXES = {".py", ".toml", ".yml", ".yaml", ".sh", ".conf", ".env", ""}
          PATTERNS = (
              (
                  re.compile(r"(?m)^\\s*(?:from|import)\\s+surrealdb\\b"),
                  "SurrealDB Python SDK import",
              ),
              (
                  re.compile(r"surrealdb/surrealdb(?::[^\\s\\\"']+)?", re.I),
                  "SurrealDB server image",
              ),
              (re.compile(r"\\brepo_query\\b"), "generic SurrealQL compatibility query API"),
              (re.compile(r"\\blegacy_query_compat\\b"), "legacy query compatibility module"),
              (re.compile(r"\\bsurreal_commands\\b"), "obsolete Surreal-named command package"),
              (
                  re.compile(r"\\bSURREAL_[A-Z0-9_]+\\b"),
                  "obsolete SurrealDB runtime configuration",
              ),
          )


          def files() -> list[Path]:
              found = {path for path in ROOT_FILES if path.exists()}
              for directory in RUNTIME_DIRS:
                  if directory.exists():
                      found.update(
                          path
                          for path in directory.rglob("*")
                          if path.is_file() and path.suffix.lower() in SUFFIXES
                      )
              return sorted(found)


          def dependency_name(requirement: str) -> str:
              return re.split(r"[<>=!~;\\[\\s]", requirement, maxsplit=1)[0].strip().lower()


          def main() -> int:
              failures: list[str] = []
              for path in files():
                  if path in ALLOWED:
                      continue
                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  for pattern, description in PATTERNS:
                      if pattern.search(text):
                          failures.append(f"{path.relative_to(ROOT)}: {description}")

              with (ROOT / "pyproject.toml").open("rb") as handle:
                  project = tomllib.load(handle)
              dependencies = project.get("project", {}).get("dependencies", [])
              for prohibited in ("surrealdb", "surreal-commands", "surreal_commands"):
                  if any(
                      dependency_name(str(requirement)) == prohibited
                      for requirement in dependencies
                  ):
                      failures.append(
                          f"pyproject.toml: prohibited dependency {prohibited}"
                      )

              legacy_parser = ROOT / "open_notebook/database/legacy_query_compat.py"
              if legacy_parser.exists():
                  failures.append("legacy_query_compat.py must not exist")

              if failures:
                  print(
                      "PostgreSQL-only runtime boundary violations detected:",
                      file=sys.stderr,
                  )
                  for failure in failures:
                      print(f"  - {failure}", file=sys.stderr)
                  return 1

              print("PostgreSQL-only runtime boundary clean.")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          '''.replace("          ", ""), encoding="utf-8")
          PY
          uv python install 3.11
          uv sync --frozen --group dev
          uv run ruff check . --fix
          uv run ruff format \
            api/command_service.py \
            api/podcast_service.py \
            api/routers/commands.py \
            api/routers/embedding_rebuild.py \
            api/routers/notebooks.py \
            api/routers/sources.py \
            commands/embedding_commands.py \
            commands/podcast_commands.py \
            commands/source_commands.py \
            open_notebook/database/repository.py \
            open_notebook/domain/notebook.py \
            scripts/check_no_surreal_runtime.py \
            tests/test_postgres_command_queue.py \
            tests/test_postgres_repository.py
          uv run ruff check .
          python3 scripts/check_no_surreal_runtime.py
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply non-breaking npm security fixes
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only
          npm audit fix --package-lock-only
          npm ci
          npm audit --audit-level=moderate
          npm run lint
          npm run test:coverage
          npm run build
      - name: Commit quality and security fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(ci): clean repository migration lint and frontend audit"
          git push origin HEAD:fix/valt-runtime-hardening
