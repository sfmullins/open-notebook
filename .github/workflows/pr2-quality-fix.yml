name: PR2 quality remediation

on:
  push:
    branches:
      - fix/valt-runtime-hardening

permissions:
  contents: write

concurrency:
  group: pr2-quality-remediation
  cancel-in-progress: true

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/valt-runtime-hardening
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Repair backend lint introduced by repository migration
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uv sync --frozen --group dev
          uv run ruff check . --fix
          uv run ruff format \
            api/command_service.py \
            api/podcast_service.py \
            api/routers/commands.py \
            api/routers/embedding_rebuild.py \
            api/routers/notebooks.py \
            api/routers/sources.py \
            commands/embedding_commands.py \
            commands/podcast_commands.py \
            commands/source_commands.py \
            open_notebook/database/repository.py \
            open_notebook/domain/notebook.py \
            scripts/check_no_surreal_runtime.py \
            tests/test_postgres_command_queue.py \
            tests/test_postgres_repository.py
          uv run ruff check .
          python3 scripts/check_no_surreal_runtime.py
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply non-breaking npm security fixes
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only
          npm audit fix --package-lock-only
          npm ci
          npm audit --audit-level=moderate
          npm run lint
          npm run test:coverage
          npm run build
      - name: Commit quality and security fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(ci): clean repository migration lint and frontend audit"
          git push origin HEAD:fix/valt-runtime-hardening
