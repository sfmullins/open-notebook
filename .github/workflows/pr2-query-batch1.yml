name: PR2 native repository migration batch 1

on:
  push:
    branches:
      - fix/valt-runtime-hardening

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/valt-runtime-hardening
          fetch-depth: 0
      - name: Fix one-shot EOF replacement and run migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/pr2_query_batch1.py')
          text = p.read_text()
          old = '''    e = text.find(end, s)\n    if e < 0:\n        raise RuntimeError(f"{label}: end marker not found")\n'''
          new = '''    e = len(text) if end == "" else text.find(end, s)\n    if e < 0:\n        raise RuntimeError(f"{label}: end marker not found")\n'''
          if old not in text:
              raise SystemExit('replace_block patch target missing')
          p.write_text(text.replace(old, new, 1))
          PY
          python3 scripts/pr2_query_batch1.py
          python3 -m compileall -q open_notebook/domain/notebook.py open_notebook/ai/model_discovery.py open_notebook/utils/proxy.py
          ! grep -nF 'repo_query' open_notebook/domain/notebook.py open_notebook/ai/model_discovery.py
          ! grep -nF 'SURREAL_' open_notebook/utils/proxy.py
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(db): migrate domain queries to typed PostgreSQL operations"
          git push origin HEAD:fix/valt-runtime-hardening
