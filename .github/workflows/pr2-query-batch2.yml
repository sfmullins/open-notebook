name: PR2 native repository migration batch 2

on:
  push:
    branches:
      - fix/valt-runtime-hardening

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/valt-runtime-hardening
          fetch-depth: 0
      - name: Run migration batch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pr2_query_batch2.py
          python3 -m compileall -q api/routers/config.py api/routers/credentials.py api/routers/models.py api/credentials_service.py open_notebook/podcasts/models.py commands/podcast_commands.py
          ! grep -nF 'repo_query' api/routers/config.py api/routers/credentials.py api/routers/models.py api/credentials_service.py open_notebook/podcasts/models.py commands/podcast_commands.py
          ! grep -nF 'SURREAL_' open_notebook/podcasts/models.py
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(db): migrate API and podcast queries to repository operations"
          git push origin HEAD:fix/valt-runtime-hardening
