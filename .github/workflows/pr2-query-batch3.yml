name: PR2 native repository migration batch 3

on:
  push:
    branches:
      - fix/valt-runtime-hardening

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/valt-runtime-hardening
          fetch-depth: 0
      - name: Run migration batch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pr2_query_batch3.py
          python3 -m compileall -q \
            open_notebook/database/embeddings.py \
            commands/embedding_commands.py \
            api/routers/embedding_rebuild.py \
            api/routers/_chat_shared.py \
            api/routers/chat.py \
            api/routers/source_chat.py \
            api/routers/notebooks.py
          ! grep -nF 'repo_query' \
            open_notebook/database/embeddings.py \
            commands/embedding_commands.py \
            api/routers/embedding_rebuild.py \
            api/routers/_chat_shared.py \
            api/routers/chat.py \
            api/routers/source_chat.py \
            api/routers/notebooks.py
          ! grep -nF 'SURREAL_' \
            open_notebook/database/embeddings.py \
            commands/embedding_commands.py \
            api/routers/embedding_rebuild.py \
            api/routers/_chat_shared.py \
            api/routers/chat.py \
            api/routers/source_chat.py \
            api/routers/notebooks.py
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(db): finish typed repository migration for chat, notebooks, embeddings"
          git push origin HEAD:fix/valt-runtime-hardening
