name: PR2 residue inventory v2

on:
  push:
    branches:
      - fix/valt-runtime-hardening

permissions:
  contents: write

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/valt-runtime-hardening
          fetch-depth: 0
      - name: Build residue inventory
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# PR2 residue inventory'
            echo
            for pattern in 'repo_query' 'legacy_query_compat' 'surreal_commands' 'surreal-commands' 'SURREAL_' 'asciidoc' 'imageio-ffmpeg' 'ffmpeg' ':latest'; do
              echo "## ${pattern}"
              grep -RInF --exclude-dir=.git --exclude='PR2_RUNTIME_RESIDUE.txt' --exclude='pr2-residue-inventory-v2.yml' "$pattern" . || true
              echo
            done
          } > PR2_RUNTIME_RESIDUE.txt
          rm -f PR2_INVENTORY_TRIGGER .github/workflows/pr2-residue-inventory-v2.yml
      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh PR2 runtime residue inventory"
          git push origin HEAD:fix/valt-runtime-hardening
