name: PR2 residue refresh

on:
  push:
    branches:
      - fix/valt-runtime-hardening

permissions:
  contents: write

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/valt-runtime-hardening
          fetch-depth: 0
      - name: Capture current residue
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# PR2 current residue'
            echo
            for pattern in 'repo_query' 'legacy_query_compat' 'surreal_commands' 'SURREAL_' 'asciidoc' 'imageio-ffmpeg' 'ffmpeg' ':latest'; do
              echo "## ${pattern}"
              grep -RInF \
                --exclude-dir=.git \
                --exclude='PR2_RUNTIME_RESIDUE.txt' \
                --exclude='pr2-residue-refresh.yml' \
                "$pattern" . || true
              echo
            done
          } > PR2_RUNTIME_RESIDUE.txt
          rm .github/workflows/pr2-residue-refresh.yml
      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh PR2 runtime residue inventory"
          git push origin HEAD:fix/valt-runtime-hardening
