name: PR2 verification

on:
  push:
    branches:
      - fix/valt-runtime-hardening

permissions:
  contents: read

concurrency:
  group: pr2-verification
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  UV_PYTHON: "3.11"
  NODE_VERSION: "22"

jobs:
  command-queue-restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/valt-runtime-hardening
          fetch-depth: 0
      - name: Restore verified queue implementation and remove stale import
        shell: bash
        run: |
          set -euo pipefail
          git show c66244d9e6d7b3165e550997c5f64f786a2aa355:command_queue/__init__.py > command_queue/__init__.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('command_queue/__init__.py')
          text = path.read_text(encoding='utf-8')
          needle = '    get_database_url,\n'
          if text.count(needle) != 1:
              raise SystemExit('Expected exactly one stale get_database_url import')
          path.write_text(text.replace(needle, ''), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add command_queue/__init__.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(queue): restore verified asyncpg queue implementation"
          git push origin HEAD:fix/valt-runtime-hardening

  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/check_no_surreal_runtime.py

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://open_notebook:open_notebook@127.0.0.1:5432/open_notebook
      POSTGRES_URL: postgresql://open_notebook:open_notebook@127.0.0.1:5432/open_notebook
      OPEN_NOTEBOOK_ENCRYPTION_KEY: ci-test-key
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: open_notebook
          POSTGRES_PASSWORD: open_notebook
          POSTGRES_DB: open_notebook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U open_notebook -d open_notebook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.9"
      - run: uv python install "$PYTHON_VERSION"
      - run: uv lock --check
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run python -m mypy .
      - run: uv run pytest tests/ -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --audit-level=moderate

  migration-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://open_notebook:open_notebook@127.0.0.1:5432/open_notebook
      POSTGRES_URL: postgresql://open_notebook:open_notebook@127.0.0.1:5432/open_notebook
      OPEN_NOTEBOOK_ENCRYPTION_KEY: ci-test-key
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: open_notebook
          POSTGRES_PASSWORD: open_notebook
          POSTGRES_DB: open_notebook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U open_notebook -d open_notebook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.12.9"
      - run: uv python install "$PYTHON_VERSION"
      - run: uv sync --frozen
      - name: Start pinned legacy SurrealDB fixture
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name surreal-parity -p 127.0.0.1:8000:8000 \
            surrealdb/surrealdb:v2.6.5 \
            start --log info --user root --pass root memory
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs surreal-parity
          exit 1
      - name: Seed semantic migration fixture
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/parity.surql <<'SQL'
          CREATE notebook:parity SET name='Parity Notebook', description='migration fixture';
          CREATE source:parity SET title='Parity Source', full_text='Fixture body';
          RELATE source:parity->reference->notebook:parity SET role='primary';
          CREATE source_embedding:parity SET source=source:parity, `order`=0, content='fixture chunk', embedding=[0.1,0.2,0.3];
          CREATE note:parity SET title='Parity Note', content='note body', embedding=[0.4,0.5,0.6];
          SQL
          curl --fail --silent --show-error --user root:root \
            -H 'Accept: application/json' \
            -H 'Content-Type: text/plain' \
            -H 'surreal-ns: open_notebook' \
            -H 'surreal-db: open_notebook' \
            --data-binary @/tmp/parity.surql \
            http://127.0.0.1:8000/sql | tee /tmp/seed-result.json
          python3 - <<'PY'
          import json
          payload = json.load(open('/tmp/seed-result.json', encoding='utf-8'))
          assert payload and all(item.get('status') == 'OK' for item in payload), payload
          PY
      - name: Run production migration
        run: >-
          uv run python scripts/migrate_surreal_to_postgres.py
          --surreal-url http://127.0.0.1:8000
          --surreal-user root
          --surreal-password root
          --surreal-namespace open_notebook
          --surreal-database open_notebook
      - name: Assert semantic parity and non-empty guard
        run: uv run python tests/integration/check_surreal_postgres_parity.py
      - name: Stop legacy fixture
        if: always()
        run: docker rm -f surreal-parity || true

  image-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Build final runtime image
        run: docker build --target runtime -t open-notebook:pr2 .
      - name: Generate full-image SBOM with pinned Syft 1.51.0
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/out" \
            anchore/syft:v1.51.0 \
            docker:open-notebook:pr2 -o syft-json=/out/sbom.syft.json
      - name: Enforce full-image licence policy
        run: python3 scripts/check_sbom_licenses.py sbom.syft.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2-sbom
          path: sbom.syft.json
          if-no-files-found: error

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/check_md_links.py
