name: PR2 verification

on:
  push:
    branches:
      - fix/valt-runtime-hardening

permissions:
  contents: write

concurrency:
  group: pr2-verification
  cancel-in-progress: true

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/check_no_surreal_runtime.py

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://open_notebook:open_notebook@127.0.0.1:5432/open_notebook
      POSTGRES_URL: postgresql://open_notebook:open_notebook@127.0.0.1:5432/open_notebook
      OPEN_NOTEBOOK_ENCRYPTION_KEY: ci-test-key
      UV_PYTHON: "3.11"
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: open_notebook
          POSTGRES_PASSWORD: open_notebook
          POSTGRES_DB: open_notebook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U open_notebook -d open_notebook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/valt-runtime-hardening
          fetch-depth: 0
      - name: Apply verified migration fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pr2_type_fix.py
          python3 PR2_test_migration.py
          rm PR2_test_migration.py scripts/pr2_type_fix.py
          if grep -R --line-number --include='*.py' 'repo_query' tests; then
            echo 'stale repo_query compatibility reference remains in tests' >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv python install 3.11
      - run: uv lock --check
      - run: uv sync --frozen --group dev
      - name: Format migrated files
        run: |
          uv run ruff format \
            open_notebook/domain/provider_config.py \
            open_notebook/ai/model_discovery.py \
            tests/test_chat_routers_characterization.py \
            tests/test_config_endpoint_no_leak.py \
            tests/test_domain.py \
            tests/test_error_message_sanitization.py \
            tests/test_models_api.py \
            tests/test_podcast_episode_model_resolution.py \
            tests/test_podcast_job_status_batching.py \
            tests/test_podcast_speaker_profile.py \
            tests/test_proxy.py \
            tests/test_recently_viewed_api.py \
            tests/test_search_api.py \
            tests/test_sources_api.py \
            tests/test_typed_exceptions_reach_handlers.py
      - run: uv run ruff check .
      - run: uv run python -m mypy .
      - run: uv run pytest tests/ -q --tb=short
      - name: Persist fully verified backend migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "test(postgres): migrate characterization coverage to typed repositories"
          git push origin HEAD:fix/valt-runtime-hardening

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --audit-level=moderate
