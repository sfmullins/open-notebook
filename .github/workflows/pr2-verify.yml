name: PR2 verification

on:
  push:
    branches:
      - fix/valt-runtime-hardening

permissions:
  contents: read

concurrency:
  group: pr2-verification
  cancel-in-progress: true

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/check_no_surreal_runtime.py

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://open_notebook:open_notebook@127.0.0.1:5432/open_notebook
      POSTGRES_URL: postgresql://open_notebook:open_notebook@127.0.0.1:5432/open_notebook
      OPEN_NOTEBOOK_ENCRYPTION_KEY: ci-test-key
      UV_PYTHON: "3.11"
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: open_notebook
          POSTGRES_PASSWORD: open_notebook
          POSTGRES_DB: open_notebook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U open_notebook -d open_notebook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv python install 3.11
      - run: uv lock --check
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run python -m mypy .
      - run: uv run pytest tests/ -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --audit-level=moderate
