services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-open_notebook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-open_notebook}
      POSTGRES_DB: ${POSTGRES_DB:-open_notebook}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-open_notebook} -d ${POSTGRES_DB:-open_notebook}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  open_notebook:
    build:
      context: .
      target: runtime
    image: open-notebook:local
    ports:
      - "8502:8502"
      - "5055:5055"
    environment:
      OPEN_NOTEBOOK_ENCRYPTION_KEY: ${OPEN_NOTEBOOK_ENCRYPTION_KEY:-change-me-to-a-secret-string}
      DATABASE_URL: postgresql://${POSTGRES_USER:-open_notebook}:${POSTGRES_PASSWORD:-open_notebook}@postgres:5432/${POSTGRES_DB:-open_notebook}
      POSTGRES_URL: postgresql://${POSTGRES_USER:-open_notebook}:${POSTGRES_PASSWORD:-open_notebook}@postgres:5432/${POSTGRES_DB:-open_notebook}
      OPEN_NOTEBOOK_WORKER_MAX_TASKS: ${OPEN_NOTEBOOK_WORKER_MAX_TASKS:-5}
    volumes:
      - ./notebook_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
