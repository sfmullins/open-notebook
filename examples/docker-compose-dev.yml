services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: open_notebook
      POSTGRES_PASSWORD: open_notebook
      POSTGRES_DB: open_notebook
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_notebook -d open_notebook"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  open_notebook:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "8502:8502"
      - "5055:5055"
    env_file:
      - ./docker.env
    environment:
      DATABASE_URL: postgresql://open_notebook:open_notebook@postgres:5432/open_notebook
      POSTGRES_URL: postgresql://open_notebook:open_notebook@postgres:5432/open_notebook
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./notebook_data:/app/data
    restart: unless-stopped
