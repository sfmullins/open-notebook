# Docker Compose - 100% Local AI Setup
#
# PostgreSQL/pgvector stores data, Ollama provides local LLM/embeddings and
# Speaches provides local TTS/STT. No external AI API is required.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: open_notebook
      POSTGRES_PASSWORD: open_notebook
      POSTGRES_DB: open_notebook
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_notebook -d open_notebook"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    pull_policy: always

  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: speaches
    ports:
      - "8969:8000"
    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub
    restart: unless-stopped

  open_notebook:
    build:
      context: .
      target: runtime
    image: open-notebook:local
    ports:
      - "8502:8502"
      - "5055:5055"
    environment:
      OPEN_NOTEBOOK_ENCRYPTION_KEY: ${OPEN_NOTEBOOK_ENCRYPTION_KEY:-change-me-to-a-secret-string}
      DATABASE_URL: postgresql://open_notebook:open_notebook@postgres:5432/open_notebook
      POSTGRES_URL: postgresql://open_notebook:open_notebook@postgres:5432/open_notebook
      OLLAMA_API_BASE: http://ollama:11434
    volumes:
      - ./notebook_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      speaches:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_models:
  hf-hub-cache:

# Example model downloads after startup:
#   docker compose exec ollama ollama pull mistral
#   docker compose exec ollama ollama pull nomic-embed-text
#   docker compose exec speaches uv tool run speaches-cli model download speaches-ai/Kokoro-82M-v1.0-ONNX
#   docker compose exec speaches uv tool run speaches-cli model download Systran/faster-whisper-small
#
# Configure Ollama at http://ollama:11434 and Speaches at
# http://speaches:8000/v1 from the Open Notebook settings UI.
