# Docker Compose with Ollama (Free Local AI)
#
# This setup includes PostgreSQL/pgvector and Ollama for local AI models.
# Usage: copy to docker-compose.yml, set OPEN_NOTEBOOK_ENCRYPTION_KEY, then
# run `docker compose up -d` and pull the desired Ollama model.

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_USER: open_notebook
      POSTGRES_PASSWORD: open_notebook
      POSTGRES_DB: open_notebook
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_notebook -d open_notebook"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.33.2
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    pull_policy: if_not_present

  open_notebook:
    build:
      context: .
      target: runtime
    image: open-notebook:local
    ports:
      - "8502:8502"
      - "5055:5055"
    environment:
      OPEN_NOTEBOOK_ENCRYPTION_KEY: ${OPEN_NOTEBOOK_ENCRYPTION_KEY:-change-me-to-a-secret-string}
      DATABASE_URL: postgresql://open_notebook:open_notebook@postgres:5432/open_notebook
      POSTGRES_URL: postgresql://open_notebook:open_notebook@postgres:5432/open_notebook
      OLLAMA_API_BASE: http://ollama:11434
    volumes:
      - ./notebook_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_models:
