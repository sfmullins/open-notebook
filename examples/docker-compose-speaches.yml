# Docker Compose with Speaches (Local TTS/STT)
#
# Speaches provides private local speech processing while PostgreSQL/pgvector
# stores Open Notebook data. Set OPEN_NOTEBOOK_ENCRYPTION_KEY before use.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: open_notebook
      POSTGRES_PASSWORD: open_notebook
      POSTGRES_DB: open_notebook
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_notebook -d open_notebook"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: speaches
    ports:
      - "8969:8000"
    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub
    restart: unless-stopped
    # For GPU acceleration use ghcr.io/speaches-ai/speaches:latest-cuda
    # and add the appropriate GPU device mapping.

  open_notebook:
    build:
      context: .
      target: runtime
    image: open-notebook:local
    ports:
      - "8502:8502"
      - "5055:5055"
    environment:
      OPEN_NOTEBOOK_ENCRYPTION_KEY: ${OPEN_NOTEBOOK_ENCRYPTION_KEY:-change-me-to-a-secret-string}
      DATABASE_URL: postgresql://open_notebook:open_notebook@postgres:5432/open_notebook
      POSTGRES_URL: postgresql://open_notebook:open_notebook@postgres:5432/open_notebook
    volumes:
      - ./notebook_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      speaches:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  hf-hub-cache:

# After startup, download speech models as required, for example:
#   docker compose exec speaches uv tool run speaches-cli model download speaches-ai/Kokoro-82M-v1.0-ONNX
#   docker compose exec speaches uv tool run speaches-cli model download Systran/faster-whisper-small
# Configure the Speaches endpoint in Open Notebook as http://speaches:8000/v1.
