services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: open_notebook
      POSTGRES_PASSWORD: open_notebook
      POSTGRES_DB: ${RC_POSTGRES_DB:-open_notebook}
    volumes:
      - ${DATA_DIR:?set DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_notebook -d ${RC_POSTGRES_DB:-open_notebook}"]
      interval: 3s
      timeout: 5s
      retries: 30

  app:
    image: ${APP_IMAGE:?set APP_IMAGE}
    ports:
      - "127.0.0.1:${API_PORT:?set API_PORT}:5055"
      - "127.0.0.1:${FE_PORT:?set FE_PORT}:8502"
    environment:
      - API_URL=${RC_API_URL:-}
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=${RC_ENCRYPTION_KEY:-release-test-key}
      - DATABASE_URL=postgresql://open_notebook:open_notebook@postgres:5432/${RC_POSTGRES_DB:-open_notebook}
      - POSTGRES_URL=postgresql://open_notebook:open_notebook@postgres:5432/${RC_POSTGRES_DB:-open_notebook}
      - OPEN_NOTEBOOK_ENABLE_DOCLING=${RC_ENABLE_DOCLING:-}
      - OPEN_NOTEBOOK_ENABLE_CRAWL4AI=${RC_ENABLE_CRAWL4AI:-}
    volumes:
      - ${DATA_DIR}/notebook:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  proxy:
    image: nginx:alpine
    ports:
      - "127.0.0.1:${PROXY_PORT:?set PROXY_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
